<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
   <div class="form-field">
    <label for="BlogTitle" class="form-label">Blog Title</label>
    <input type="text" class="form-control" id="BlogTitle" name="BlogTitle"
           placeholder="Enter blog title">
</div>

<div class="form-field">
    <label for="BlogAuthor" class="form-label">Blog Author</label>
    <input type="text" class="form-control" id="BlogAuthor" name="BlogAuthor"
           placeholder="Enter author name">
</div>

<div class="form-field">
    <label for="BlogContent" class="form-label">Blog Content</label>
    <textarea class="form-control" id="BlogContent" name="BlogContent"
              rows="5" placeholder="Write your blog content here"></textarea>
</div>
</div>

<button type="button" class="btn-solid theme-success" id="btnSave">Save</button>

<button type="button" class="btn-solid theme-danger" id="btnDelete">Delete</button>


<script src="https://code.jquery.com/jquery-3.7.1.min.js" 
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous">
    </script>

    <script>

        $(document).ready(function(){
            let storedTitle = localStorage.getItem("title");
            let storedAuthor = localStorage.getItem("author");
            let storedContent = localStorage.getItem("content");

            if(storedTitle && storedAuthor && storedContent){
                $("#BlogTitle").val(storedTitle);
                $("#BlogAuthor").val(storedAuthor);
                $("#BlogContent").val(storedContent);
            }
        })
         
        $("#btnSave").click(function(){
            const title= $("#BlogTitle").val();
            const author=$("#BlogAuthor").val();
            const content=$("#BlogContent").val();

            localStorage.setItem("title", title);
            localStorage.setItem("author", author);
            localStorage.setItem("content", content);

            console.log({title,author,content});
        })

        $("#btnDelete").click(function(){
            localStorage.removeItem("title");
            localStorage.removeItem("author");
            localStorage.removeItem("content");

            console.log("Data deleted from local storage");

            $("#BlogTitle").val("");
            $("#BlogAuthor").val("");
            $("#BlogContent").val("");
        })
    </script>
</body>
</html>
